name: Upstream Sync Repair

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "The @openai/codex version being synchronized."
        required: true
      upstream_pr:
        description: "The upstream-sync pull request number."
        required: true
      upstream_ref:
        description: "The upstream-sync branch to repair."
        required: true
      repair_attempt:
        description: "The current bounded repair attempt."
        required: true
      repair_source_run:
        description: "The workflow run whose failure triggered this repair."
        required: true
      repair_source_job:
        description: "The failing job category (ci or parity)."
        required: true
      trusted_actor:
        description: "The trusted maintainer actor from the original sync run."
        required: true
      aw_context:
        description: "Verified gh-aw dispatch provenance for the trusted actor."
        required: true

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync-repair-${{ inputs.upstream_pr }}
  cancel-in-progress: false

jobs:
  parity:
    name: Repair upstream sync
    uses: ./.github/workflows/codex-sdk-parity-pass.lock.yml
    with:
      upstream_sync_pr: true
      upstream_version: ${{ inputs.upstream_version }}
      upstream_pr: ${{ inputs.upstream_pr }}
      upstream_ref: ${{ inputs.upstream_ref }}
      repair_attempt: ${{ inputs.repair_attempt }}
      repair_source_run: ${{ inputs.repair_source_run }}
      repair_source_job: ${{ inputs.repair_source_job }}
      trusted_actor: ${{ inputs.trusted_actor }}
      aw_context: ${{ inputs.aw_context }}
    secrets: inherit

  gate:
    name: Re-run CI gate after repair
    needs: parity
    if: needs.parity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v4

      - name: Gate, merge, and verify release
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          UPSTREAM_USE_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN == '' }}
        run: >-
          python .github/scripts/upstream_sync_gate.py gate
          --repo "${{ github.repository }}"
          --pr "${{ inputs.upstream_pr }}"
          --branch "${{ inputs.upstream_ref }}"
          --version "${{ inputs.upstream_version }}"
          --attempt "${{ inputs.repair_attempt }}"
          --actor "${{ inputs.trusted_actor }}"
          --source-run "${{ github.run_id }}"

  retry-parity:
    name: Retry a failed repair session
    needs: parity
    if: always() && needs.parity.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v4

      - name: Dispatch next bounded repair or create issue
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          UPSTREAM_USE_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN == '' }}
        run: >-
          python .github/scripts/upstream_sync_gate.py schedule-repair
          --repo "${{ github.repository }}"
          --pr "${{ inputs.upstream_pr }}"
          --branch "${{ inputs.upstream_ref }}"
          --version "${{ inputs.upstream_version }}"
          --attempt "${{ inputs.repair_attempt }}"
          --actor "${{ inputs.trusted_actor }}"
          --source-run "${{ github.run_id }}"
          --source-job parity
