name: Upstream Sync (@openai/codex)

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 09:00/21:00 UTC == 10:00/22:00 Europe/Vienna (CET).
    - cron: "0 9,21 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      upstream_branch: automation/upstream-codex-${{ steps.latest.outputs.latest }}
      upstream_pr: ${{ steps.existing-pr.outputs.number || steps.cpr.outputs.pull-request-number }}
      upstream_version: ${{ steps.latest.outputs.latest }}
      repair_exhausted: ${{ steps.existing-pr.outputs.repair_exhausted }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve latest Codex version
        id: latest
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view @openai/codex version | xargs)"
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable Codex version, got: $latest"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Check for an existing upstream PR
        id: existing-pr
        uses: actions/github-script@v7
        env:
          UPSTREAM_VERSION: ${{ steps.latest.outputs.latest }}
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = `automation/upstream-codex-${process.env.UPSTREAM_VERSION}`;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: "master",
              per_page: 100,
            });
            const existing = pulls.find(
              pull => pull.head.repo?.full_name === context.repo.owner + "/" + context.repo.repo && pull.head.ref === branch,
            );

            core.setOutput("exists", existing ? "true" : "false");
            core.setOutput("number", existing?.number ?? "");
            core.setOutput("url", existing?.html_url ?? "");

            if (existing) {
              const failureTitle = `Upstream sync ${process.env.UPSTREAM_VERSION} failed after automatic repairs`;
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              });
              const exhausted = issues.find(issue => !issue.pull_request && issue.title === failureTitle);
              core.setOutput("repair_exhausted", exhausted ? "true" : "false");
              if (exhausted) {
                core.notice(`Automatic repairs are exhausted; see ${exhausted.html_url}. Close the issue after resolving the blocker to resume.`);
                return;
              }
              core.notice(`Upstream PR #${existing.number} already exists for ${process.env.UPSTREAM_VERSION}; resuming parity and CI on its current head.`);
            }

      - name: Report existing upstream PR
        if: steps.existing-pr.outputs.exists == 'true' && steps.existing-pr.outputs.repair_exhausted != 'true'
        env:
          EXISTING_PR_NUMBER: ${{ steps.existing-pr.outputs.number }}
          EXISTING_PR_URL: ${{ steps.existing-pr.outputs.url }}
        run: |
          echo "Resuming upstream sync on PR #${EXISTING_PR_NUMBER}: ${EXISTING_PR_URL}"

      - name: Checkout
        if: steps.existing-pr.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve Codex Versions
        if: steps.existing-pr.outputs.exists != 'true'
        id: versions
        shell: bash
        env:
          LATEST_CODEX_VERSION: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail

          PINNED="$(python3 - <<'PY'
          import json
          from pathlib import Path

          marker = json.loads(Path("UPSTREAM_CODEX_VERSION.json").read_text(encoding="utf-8"))
          pinned = marker.get("api")
          if not isinstance(pinned, str) or not pinned.strip():
              raise SystemExit("UPSTREAM_CODEX_VERSION.json must contain a non-empty api version")
          print(pinned.strip())
          PY
          )"
          LATEST="$LATEST_CODEX_VERSION"

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$PINNED" = "$LATEST" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check upstream tag availability
        if: steps.existing-pr.outputs.exists != 'true' && steps.versions.outputs.up_to_date != 'true'
        id: tag
        shell: bash
        env:
          LATEST_CODEX_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          # npm and GitHub publication need not finish at the same time.
          tag="$(git -C external/codex ls-remote --tags origin "refs/tags/rust-v${LATEST_CODEX_VERSION}")"
          if [ -z "$tag" ]; then
            echo "::notice::Codex ${LATEST_CODEX_VERSION} has no matching git tag yet; retrying on the next scheduled run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pin + submodule
        if: steps.tag.outputs.ready == 'true'
        shell: bash
        env:
          LATEST_CODEX_VERSION: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker_path = Path("UPSTREAM_CODEX_VERSION.json")
          marker = json.loads(marker_path.read_text(encoding="utf-8"))
          marker["api"] = os.environ["LATEST_CODEX_VERSION"]
          marker_path.write_text(json.dumps(marker, indent=2) + "\n", encoding="utf-8")
          PY

          git -C external/codex fetch origin "refs/tags/rust-v${LATEST_CODEX_VERSION}:refs/tags/rust-v${LATEST_CODEX_VERSION}"
          git -C external/codex checkout --detach "rust-v${LATEST_CODEX_VERSION}"

      - name: Create pull request
        if: steps.tag.outputs.ready == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          base: master
          branch: automation/upstream-codex-${{ steps.versions.outputs.latest }}
          committer: Jonas Kamsker <11245306+JKamsker@users.noreply.github.com>
          author: Jonas Kamsker <11245306+JKamsker@users.noreply.github.com>
          commit-message: "chore(upstream): bump @openai/codex to ${{ steps.versions.outputs.latest }}"
          title: "chore(upstream): bump @openai/codex to ${{ steps.versions.outputs.latest }}"
          body: |
            Automated upstream update of the Codex API pin and vendored source.
            DTO regeneration and SDK repairs run on this branch before the CI gate can merge it.

            - Previous: ${{ steps.versions.outputs.pinned }}
            - Latest: ${{ steps.versions.outputs.latest }}

            The dynamic parity pass runs on this branch next. The final branch SHA is merged automatically only after its exact CI run succeeds, and the post-merge NuGet release is monitored. If upstream removed or changed a handwritten SDK surface, the bounded repair workflow fixes this branch or creates an issue.
          delete-branch: true

  parity:
    name: Run dynamic Codex SDK parity pass
    needs: sync
    if: needs.sync.outputs.upstream_pr != '' && needs.sync.outputs.repair_exhausted != 'true'
    uses: ./.github/workflows/codex-sdk-parity-pass.lock.yml
    with:
      upstream_sync_pr: true
      upstream_version: ${{ needs.sync.outputs.upstream_version }}
      upstream_pr: ${{ needs.sync.outputs.upstream_pr }}
      upstream_ref: ${{ needs.sync.outputs.upstream_branch }}
    secrets: inherit

  gate:
    name: Gate, merge, and verify release
    needs: [sync, parity]
    if: ${{ needs.parity.result == 'success' && needs.sync.outputs.upstream_pr != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v4

      - name: Gate exact SHA, merge, and verify NuGet release
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          UPSTREAM_USE_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN == '' }}
        run: >-
          python .github/scripts/upstream_sync_gate.py gate
          --repo "${{ github.repository }}"
          --pr "${{ needs.sync.outputs.upstream_pr }}"
          --branch "${{ needs.sync.outputs.upstream_branch }}"
          --version "${{ needs.sync.outputs.upstream_version }}"
          --attempt 0
          --source-run "${{ github.run_id }}"

  repair-parity:
    name: Repair failed parity session
    needs: [sync, parity]
    if: ${{ always() && needs.sync.result == 'success' && needs.parity.result == 'failure' && needs.sync.outputs.upstream_pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@v4

      - name: Dispatch bounded repair or create issue
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          UPSTREAM_USE_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN == '' }}
        run: >-
          python .github/scripts/upstream_sync_gate.py schedule-repair
          --repo "${{ github.repository }}"
          --pr "${{ needs.sync.outputs.upstream_pr }}"
          --branch "${{ needs.sync.outputs.upstream_branch }}"
          --version "${{ needs.sync.outputs.upstream_version }}"
          --attempt 0
          --source-run "${{ github.run_id }}"
          --source-job parity
